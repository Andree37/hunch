# Check a new ticket's severity against the SLA and lower it when it doesn't
# fit, then say why on the ticket. It never raises a severity, and only
# sev2 and sev2.5 tickets are checked.
#
# Triggered by a webhook when a ticket is created; the webhook only sends the
# id, and the flow fetches the ticket itself:
#
#   export TICKETS_API=https://tickets.example.com/api TICKETS_TOKEN=...
#   hunch serve examples/severity.yaml --backend jev --token-env HOOK_TOKEN --dedupe-key '{{ticket_id}}'
#   curl -H "Authorization: Bearer $HOOK_TOKEN" -d '{"ticket_id": 123}' http://127.0.0.1:8080/
#
# Try it without touching real tickets: the test cases fake the fetch, and
# writes are only recorded.
#   hunch tui examples/severity.yaml
#   hunch test examples/severity.yaml --backend jev
name: severity-check

backends:
  default: jev        # decides the severity
  writer: local       # writes the note on the ticket
  # A model on this machine via Ollama (ollama pull qwen2.5:0.5b).
  local: {kind: openai, base_url: "http://localhost:11434/v1", model: "qwen2.5:0.5b"}
  # The model that writes the note on the ticket; swap it on its own.
  notes: {kind: openai, base_url: "http://localhost:11434/v1", model: "qwen2.5:1.5b"}
  mock: {kind: mock, seed: demo}
  jev: {kind: jev, provider: typesafe}
  claude: {kind: anthropic, model: claude-opus-5}
  bedrock: {kind: bedrock, model: anthropic.claude-opus-5, region: us-east-1}

# The SLA, written once and used by every node below.
# EXAMPLE definitions - replace them with your SLA.
state:
  sla:
    sev2: A core feature is down or badly degraded for many users, with no workaround.
    sev2.5: A core feature is degraded for some users, or a workaround exists.
    sev3: A minor issue, a cosmetic problem, a question, or a feature request.

inputs:
  ticket_id: {type: number, description: The id the webhook sends}

nodes:
  fetch:
    action: http
    method: GET
    url: "$TICKETS_API/tickets/{{ticket_id}}"
    headers: {Authorization: "Bearer $TICKETS_TOKEN"}
    then: scope

  # A rule, not a model: only these two severities are checked.
  scope:
    switch: "{{fetch.body.severity}}"
    then:
      sev2: from_sev2
      sev2.5: from_sev2_5
      _: out_of_scope

  # Each starting severity may only stay or go down, so nothing can be raised.
  from_sev2:
    choice: |-
      Under our SLA, which severity does this ticket really have? It was filed as sev2.
      Title: {{fetch.body.title}}
      Description: {{fetch.body.description}}
      Request: {{fetch.body.request}}
    options:
      sev2: "{{sla.sev2}}"
      sev2.5: "{{sla.sev2.5}}"
      sev3: "{{sla.sev3}}"
    sees: [fetch.body.title, fetch.body.description, fetch.body.request, sla]
    threshold: 0.7
    then: {sev2: within_sla, unsure: for_human, _: lower_from_sev2}

  from_sev2_5:
    choice: |-
      Under our SLA, which severity does this ticket really have? It was filed as sev2.5.
      Title: {{fetch.body.title}}
      Description: {{fetch.body.description}}
      Request: {{fetch.body.request}}
    options:
      sev2.5: "{{sla.sev2.5}}"
      sev3: "{{sla.sev3}}"
    sees: [fetch.body.title, fetch.body.description, fetch.body.request, sla]
    threshold: 0.7
    then: {sev2.5: within_sla, unsure: for_human, _: lower_from_sev2_5}

  lower_from_sev2:
    action: output
    set: {action: lowered, from: sev2, to: "{{from_sev2.answer}}", confidence: "{{from_sev2.confidence}}"}
    then: facts

  lower_from_sev2_5:
    action: output
    set: {action: lowered, from: sev2.5, to: "{{from_sev2_5.answer}}", confidence: "{{from_sev2_5.confidence}}"}
    then: facts

  # Establish, against the SLA, the facts the note should rest on. The note
  # model then only has to phrase them.
  facts:
    questions:
      core_down:
        bool: "Is a core feature down or badly degraded?"
        criteria: {yes: "Customers can't use a main part of the product", no: "Main features work"}
      workaround:
        bool: "Is there a workaround?"
        criteria: {yes: "The customer can still get it done another way", no: "No way around it"}
      reach:
        choice: "How many users are affected?"
        options: {one: "Only this customer or one user", some: "A group of customers", many: "Most or all customers"}
      kind:
        choice: "What kind of ticket is this?"
        options:
          outage: "Something broken for many"
          bug: "Something broken for some"
          cosmetic: "Looks wrong but works"
          question: "Asking how to do something"
          request: "Asking for a change or feature"
    sees: [fetch.body.title, fetch.body.description, fetch.body.request]
    then: explain

  explain:
    action: llm
    backend: notes
    system: >-
      You write one short internal note for a support ticket explaining a
      severity change. Use only the facts given. Do not answer the customer,
      give instructions or apologise.
    prompt: |-
      Our SLA:
      - sev2: {{sla.sev2}}
      - sev2.5: {{sla.sev2.5}}
      - sev3: {{sla.sev3}}

      Ticket: {{fetch.body.title}}
      Decision: moved from {{outputs.from}} to {{outputs.to}}.

      Facts:
      - Core feature down: {{facts.core_down.answer}}
      - Workaround exists: {{facts.workaround.answer}}
      - Users affected: {{facts.reach.answer}}
      - Kind of ticket: {{facts.kind.answer}}

      Write one or two sentences for the ticket saying why it is {{outputs.to}}
      and not {{outputs.from}}, citing the facts that match the SLA.
    then: note_ok

  # The note model may be small: check its note before it goes on the
  # ticket, and fall back to a plain one if it's off.
  note_ok:
    bool: |-
      Is this a correct note explaining why a ticket moved from {{outputs.from}}
      to {{outputs.to}}, without answering the customer or adding anything untrue?
      Note: {{explain.text}}
    sees: [fetch.body.title, fetch.body.description, outputs, facts, sla]
    criteria:
      yes: It explains the move to the right severity and stays on that
      no: It names the wrong severity, answers the customer, or says something the ticket doesn't
    then: {yes: use_note, no: plain_note, unsure: plain_note}

  use_note:
    action: output
    set: {note: "{{explain.text}}"}
    then: update

  plain_note:
    action: output
    set: {note: "Severity moved from {{outputs.from}} to {{outputs.to}} under our SLA. Kind: {{facts.kind.answer}} · core feature down: {{facts.core_down.answer}} · workaround: {{facts.workaround.answer}} · users affected: {{facts.reach.answer}}."}
    then: update

  update:
    action: http
    method: PATCH
    url: "$TICKETS_API/tickets/{{ticket_id}}"
    headers: {Authorization: "Bearer $TICKETS_TOKEN"}
    body: {severity: "{{outputs.to}}"}
    idempotency_key: "severity-{{ticket_id}}"
    then: comment

  comment:
    action: http
    method: POST
    url: "$TICKETS_API/tickets/{{ticket_id}}/comments"
    headers: {Authorization: "Bearer $TICKETS_TOKEN"}
    body: {body: "{{outputs.note}}"}
    idempotency_key: "severity-note-{{ticket_id}}"

  within_sla:
    action: output
    set: {action: kept}

  for_human:
    action: output
    set: {action: needs_human, reason: "the severity call was too close to make automatically"}

  out_of_scope:
    action: output
    set: {action: skipped, reason: "only sev2 and sev2.5 tickets are checked"}
